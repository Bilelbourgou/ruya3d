<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b73ff" />
      <stop offset="100%" stop-color="#4d4dff" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3dbb" />
      <stop offset="100%" stop-color="#23237a" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d4dff" />
      <stop offset="100%" stop-color="#3636c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4d4dff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#121217" />
  
  <!-- 3D Isometric Architectural Box with glow -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M32 14 L50 24 L32 34 L14 24 Z" fill="url(#cube-top)" />
    <!-- Left Face -->
    <path d="M14 24 L32 34 L32 50 L14 40 Z" fill="url(#cube-left)" />
    <!-- Right Face -->
    <path d="M32 34 L50 24 L50 40 L32 50 Z" fill="url(#cube-right)" />
    
    <!-- Architectural grid lines / inner accent -->
    <path d="M32 14 L32 34" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6" />
    <path d="M14 24 L50 24" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4" />
    
    <!-- Core vertex beacon -->
    <circle cx="32" cy="34" r="2" fill="#ffffff" />
  </g>
</svg>
